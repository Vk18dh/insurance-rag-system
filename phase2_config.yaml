# ===========================================================================
# phase2_config.yaml
# Phase 2 – Agentic RAG Configuration
#
# RULES:
#   • Every value here can be overridden by an environment variable.
#   • Environment variable names follow the pattern:
#       PHASE2__<SECTION>__<KEY>  (double underscore separator)
#   • No secret values live here. Secrets come from .env only.
#   • Booleans: true / false   Integers: plain number   Floats: 0.0 form
# ===========================================================================

# ---------------------------------------------------------------------------
# Top-level agent metadata
# ---------------------------------------------------------------------------
agent_version: "2.0.0"
environment: "development"          # development | testing | staging | production

# ---------------------------------------------------------------------------
# LLM provider settings
# All model names and provider identifiers come from here — NEVER from code.
# ---------------------------------------------------------------------------
llm:
  provider: "gemini"                # gemini | offline
  model_name: "gemma-3-27b-it"     # Google Generative AI model identifier
  # api_key loaded exclusively from env var: GOOGLE_API_KEY
  timeout_seconds: 30.0
  max_retries: 3
  temperature: 0.0
  max_output_tokens: 1024

# ---------------------------------------------------------------------------
# Query Understanding Agent settings
# ---------------------------------------------------------------------------
query_agent:
  agent_name: "QueryUnderstandingAgent"

  # Input constraints
  max_query_length: 2000            # characters – after normalisation
  min_query_length: 3              # characters – reject very short inputs

  # NLP / LLM thresholds
  confidence_threshold: 0.6        # minimum intent confidence to trust result

  # Privacy / logging
  log_query_preview_length: 80     # max chars of raw query written to log

  # Prompt template location (relative to project root)
  prompt_template_path: "phase2/prompts/query_understanding_prompt.txt"

  # Supported intent categories (must match IntentType enum values)
  # Add new intents here — no code change required
  supported_intents:
    - "policy_information"
    - "benefits"
    - "exclusions"
    - "premium"
    - "eligibility"
    - "claim_process"
    - "maturity"
    - "surrender"
    - "loan"
    - "nomination"
    - "rider"
    - "tax_benefit"
    - "waiting_period"
    - "regulatory_information"
    - "compliance"
    - "general_inquiry"
    - "unknown"

  # Supported query classification types (must match QueryClassification enum)
  classification_types:
    - "factual"
    - "comparative"
    - "regulatory"
    - "risk"
    - "policy_specific"
    - "multi_document"
    - "general"
    - "unknown"

# ---------------------------------------------------------------------------
# Security settings
# ---------------------------------------------------------------------------
security:
  max_payload_length: 10000        # hard cap before normalisation
  allowed_origins:                  # CORS – loaded by API layer
    - "http://localhost:3000"
    - "http://localhost:5173"
  rate_limit_requests_per_minute: 60
  request_timeout_seconds: 60.0

# ---------------------------------------------------------------------------
# Logging settings
# ---------------------------------------------------------------------------
logging:
  level: "INFO"                     # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "json"                    # json | text
  log_dir: "logs/phase2"
  log_filename: "phase2.log"
  max_bytes: 10485760              # 10 MB
  backup_count: 5
  include_query_preview: true

# ---------------------------------------------------------------------------
# Phase 1 integration (retrieval – used by Retrieval Agent in Part 2)
# ---------------------------------------------------------------------------
phase1:
  chroma_collection_name: "insurance_docs"
  top_k: 8
  bm25_weight: 0.5
  vector_weight: 0.5
  similarity_threshold: 0.4

# ---------------------------------------------------------------------------
# API / FastAPI settings (used by Part 11 – Final Integration)
# ---------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  prefix: "/api/v2"
  docs_url: "/docs"
  redoc_url: "/redoc"

# ---------------------------------------------------------------------------
# Phase 1 Integration (Used by Part 2 Retrieval Agent)
# ---------------------------------------------------------------------------
phase1:
  bm25_index_path: "data/bm25_index.pkl"
  chroma_dir: "data/chroma_db"
  chroma_collection_name: "insurance_docs"

# ---------------------------------------------------------------------------
# Part 2 — Retrieval Agent settings
# All weights are configuration-driven. No hardcoded values in the codebase.
# ---------------------------------------------------------------------------
retrieval:
  top_k: 8                          # default chunks to retrieve
  timeout_seconds: 10.0             # max seconds before RetrievalTimeoutException
  max_retries: 2                    # retries for transient index failures
  similarity_threshold: 0.3         # minimum combined_score to avoid LOW_SIMILARITY warning

  # Per-classification retrieval weights.
  # Keys must match QueryClassification enum values + 'default'.
  # bm25  : weight for BM25 keyword retrieval [0, 1]
  # vector: weight for semantic retrieval    [0, 1]
  # top_k : classification-specific top_k override
  strategy_weights:
    policy_specific: { bm25: 0.7, vector: 0.3, top_k: 8 }   # policy name → BM25 wins
    factual:         { bm25: 0.5, vector: 0.5, top_k: 8 }   # balanced
    regulatory:      { bm25: 0.4, vector: 0.6, top_k: 8 }   # concept → vector wins
    comparative:     { bm25: 0.3, vector: 0.7, top_k: 10 }  # semantic comparison
    risk:            { bm25: 0.5, vector: 0.5, top_k: 8 }   # balanced
    multi_document:  { bm25: 0.4, vector: 0.6, top_k: 12 }  # broad retrieval
    general:         { bm25: 0.5, vector: 0.5, top_k: 8 }   # default balanced
    unknown:         { bm25: 0.5, vector: 0.5, top_k: 8 }   # safe default
    default:         { bm25: 0.5, vector: 0.5, top_k: 8 }   # fallback (required)

# ---------------------------------------------------------------------------
# Part 2 — Evidence ranking weights
# ranking_score = retrieval_score_weight * score
#               + keyword_overlap_weight * overlap
#               + metadata_completeness_weight * completeness
# ---------------------------------------------------------------------------
ranking:
  retrieval_score_weight: 0.6       # Phase 1 hybrid retrieval quality signal
  keyword_overlap_weight: 0.2       # query token overlap with chunk text
  metadata_completeness_weight: 0.2 # source_document + page_number present
  min_ranking_score: 0.0            # exclude chunks below this score

# ---------------------------------------------------------------------------
# Part 2 — Retrieval validation thresholds
# ---------------------------------------------------------------------------
validation:
  min_chunks_required: 1            # 0 chunks → RetrievalValidationException
  min_similarity_score: 0.1         # top chunk below this → HIGH warning
  max_incomplete_metadata_ratio: 0.5 # > 50% incomplete → LOW warning
  require_page_numbers: false       # true → warn when all page refs are N/A

# ---------------------------------------------------------------------------
# Part 3 — Verification Agent settings
# Quality and Structural checks
# ---------------------------------------------------------------------------
verification:
  min_relevance_score: 0.3
  min_evidence_count: 1
  timeout_seconds: 5.0
  max_retries: 2
  require_citations: true
  rules:
    strict_metadata: true

# ---------------------------------------------------------------------------
# 4. REASONING AGENT CONFIGURATION (Part 4)
# ---------------------------------------------------------------------------
reasoning:
  # Base Engine Configuration
  prompt_template_path: "phase2/prompts/reasoning_prompt.txt"
  max_steps: 6
  explanation_format: "structured"
  max_chunk_length: 1200
  
  # Linkage Constraints
  supported_clause_relationships:
    - supports
    - restricts
    - qualifies
    - overrides
    - references
    - complements

  # Operational Resilience
  timeout_seconds: 45
  max_retries: 3

# ---------------------------------------------------------------------------
# 5. RISK AGENT CONFIGURATION (Part 5)
# ---------------------------------------------------------------------------
risk:
  prompt_template_path: "phase2/prompts/risk_assessment_prompt.txt"
  timeout_seconds: 1.0
  escalation_rules:
    - "CRITICAL -> Immediate lock"
    - "HIGH -> Force Compliance Review"
  supported_risk_categories:
    - "Ambiguity"
    - "Legal Sensitivity"
    - "Regulatory"
    - "Insurance Exclusion"
