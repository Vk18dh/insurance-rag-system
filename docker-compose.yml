version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_JWT_SECRET=production_super_secret_override_me
      - CHROMA_PORT=8001
      - PHASE2__ENVIRONMENT=testing
      - PHASE2__LLM__PROVIDER=openrouter
      - PHASE2__LLM__API_KEY=${OPENROUTER_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app # Maps codebase for local dev sync mapping
    depends_on:
      - chromadb
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma/
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma_data:
