version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_JWT_SECRET=production_super_secret_override_me
      - CHROMA_PORT=8001
      - DATABASE_URL=postgresql://user:password@postgres:5432/majorcode
      - PHASE2__ENVIRONMENT=testing
    env_file:
      - .env
    volumes:
      - .:/app # Maps codebase for local dev sync mapping
    depends_on:
      - chromadb
      - postgres
      - ollama
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

  management:
    build:
      context: ./management
      dockerfile: ../deployment/frontend.Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma/
    environment:
      - IS_PERSISTENT=TRUE

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: majorcode
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  pg_data:
  ollama_data:
